version: '3.8'
services:
  # 1. Thằng Zookeeper (Trợ lý điều phối)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # 2. Thằng Kafka (Trái tim của hệ thống)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 3. Thằng Postgres (Cái kho chứa dữ liệu - Nơi ông dùng SQL Developer soi)
  postgres_db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ivan_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: shopee_data